[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookpool-telegram"
version = "0.1.0"
description = "BookPool Telegram conversation and notification component"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "respx>=0.22,<1", "ruff>=0.13,<1"]

[project.scripts]
bookpool-bot = "bookpool_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bookpool_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
